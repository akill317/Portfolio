<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素风个人作品展示网站 - 预览</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #00ff00;
            --color-secondary: #ff00ff;
            --color-accent: #00ffff;
            --color-background: #0a0a0a;
            --color-surface: #1a1a1a;
            --color-text: #ffffff;
            --color-text-secondary: #cccccc;
            --color-border: #333333;
            --color-shadow: rgba(0, 255, 0, 0.3);
            --font-primary: 'Press Start 2P', monospace;
            --font-secondary: 'Silkscreen', monospace;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-xxl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-secondary);
            background: var(--color-background);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 50%, rgba(0, 255, 0, 0.03) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1;
        }

        .app {
            position: relative;
            z-index: 2;
            min-height: 100vh;
        }

        .header {
            background: var(--color-surface);
            border-bottom: 2px solid var(--color-border);
            padding: var(--spacing-lg) 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }

        .header-title {
            font-family: var(--font-primary);
            font-size: 24px;
            color: var(--color-primary);
            text-shadow: 2px 2px 0 var(--color-background);
            letter-spacing: 2px;
        }

        .pixel-button {
            font-family: var(--font-primary);
            font-size: 12px;
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-surface);
            color: var(--color-text);
            border: 2px solid var(--color-border);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pixel-button:hover {
            background: var(--color-primary);
            color: var(--color-background);
            border-color: var(--color-primary);
            box-shadow: 0 0 20px var(--color-shadow);
            transform: translateY(-2px);
        }

        .pixel-button.active {
            background: var(--color-primary);
            color: var(--color-background);
            border-color: var(--color-primary);
        }

        .category-nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
            justify-content: center;
        }

        .project-grid-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-lg);
            min-height: calc(100vh - 200px);
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
            align-items: start;
        }

        .project-card {
            aspect-ratio: 4/3;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            background: var(--color-surface);
            border: 2px solid var(--color-border);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .project-card:hover {
            border-color: var(--color-primary);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5), 0 0 20px var(--color-shadow);
            transform: translateY(-4px) scale(1.05);
        }

        .card-thumbnail {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .thumbnail-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.5s ease;
            image-rendering: pixelated;
        }

        .project-card:hover .thumbnail-image {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 0%, transparent 50%, rgba(0, 0, 0, 0.8) 100%);
            display: flex;
            align-items: flex-end;
            padding: var(--spacing-md);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover .card-overlay {
            opacity: 1;
        }

        .card-title {
            font-family: var(--font-primary);
            font-size: 12px;
            color: var(--color-primary);
            margin-bottom: var(--spacing-xs);
            text-shadow: 1px 1px 0 var(--color-background);
            line-height: 1.2;
        }

        .card-category {
            font-family: var(--font-secondary);
            font-size: 10px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--color-surface);
            padding: var(--spacing-xs) var(--spacing-sm);
            border: 1px solid var(--color-border);
            display: inline-block;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
            animation: scanline 3s linear infinite;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes scanline {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: var(--spacing-md);
                text-align: center;
            }
            
            .header-title {
                font-size: 18px;
            }
            
            .project-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: var(--spacing-md);
            }
        }

        @media (max-width: 480px) {
            .project-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="scanline"></div>
        
        <header class="header">
            <div class="header-content">
                <h1 class="header-title">个人作品展示</h1>
                <div class="header-controls">
                    <button class="pixel-button">语言: EN</button>
                </div>
            </div>
            
            <nav class="category-nav">
                <button class="pixel-button active">全部</button>
                <button class="pixel-button">游戏</button>
                <button class="pixel-button">音乐</button>
                <button class="pixel-button">绘画</button>
                <button class="pixel-button">转笔</button>
            </nav>
        </header>

        <main class="project-grid-container">
            <div class="project-grid">
                <div class="project-card">
                    <div class="card-thumbnail">
                        <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&h=300&fit=crop" alt="像素冒险游戏" class="thumbnail-image">
                        <div class="card-overlay">
                            <div class="overlay-content">
                                <h3 class="card-title">像素冒险游戏</h3>
                                <span class="card-category">game</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="project-card">
                    <div class="card-thumbnail">
                        <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=300&fit=crop" alt="电子音乐作品集" class="thumbnail-image">
                        <div class="card-overlay">
                            <div class="overlay-content">
                                <h3 class="card-title">电子音乐作品集</h3>
                                <span class="card-category">music</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="project-card">
                    <div class="card-thumbnail">
                        <img src="https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=400&h=300&fit=crop" alt="数字绘画作品" class="thumbnail-image">
                        <div class="card-overlay">
                            <div class="overlay-content">
                                <h3 class="card-title">数字绘画作品</h3>
                                <span class="card-category">art</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="project-card">
                    <div class="card-thumbnail">
                        <img src="https://images.unsplash.com/photo-1581833971358-2c8b550f87b3?w=400&h=300&fit=crop" alt="转笔技巧展示" class="thumbnail-image">
                        <div class="card-overlay">
                            <div class="overlay-content">
                                <h3 class="card-title">转笔技巧展示</h3>
                                <span class="card-category">penspinning</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="project-card">
                    <div class="card-thumbnail">
                        <img src="https://images.unsplash.com/photo-1446776877081-d282a0f896e2?w=400&h=300&fit=crop" alt="太空探索游戏" class="thumbnail-image">
                        <div class="card-overlay">
                            <div class="overlay-content">
                                <h3 class="card-title">太空探索游戏</h3>
                                <span class="card-category">game</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="project-card">
                    <div class="card-thumbnail">
                        <img src="https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?w=400&h=300&fit=crop" alt="概念艺术设计" class="thumbnail-image">
                        <div class="card-overlay">
                            <div class="overlay-content">
                                <h3 class="card-title">概念艺术设计</h3>
                                <span class="card-category">art</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 简单的交互功能
        document.querySelectorAll('.pixel-button').forEach(button => {
            button.addEventListener('click', function() {
                // 移除所有active类
                document.querySelectorAll('.pixel-button').forEach(btn => btn.classList.remove('active'));
                // 添加active类到当前按钮
                this.classList.add('active');
            });
        });

        // 卡片点击效果
        document.querySelectorAll('.project-card').forEach(card => {
            card.addEventListener('click', function() {
                alert('点击了作品卡片！在实际应用中这里会打开详情模态框。');
            });
        });
    </script>
</body>
</html>
