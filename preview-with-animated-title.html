<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erenyx - 像素风个人作品展示网站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #00ff00;
            --color-secondary: #ff00ff;
            --color-accent: #00ffff;
            --color-background: #0a0a0a;
            --color-surface: #1a1a1a;
            --color-text: #ffffff;
            --color-text-secondary: #cccccc;
            --color-border: #333333;
            --color-shadow: rgba(0, 255, 0, 0.3);
            --font-primary: 'Press Start 2P', monospace;
            --font-secondary: 'Silkscreen', monospace;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-xxl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-secondary);
            background: var(--color-background);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 50%, rgba(0, 255, 0, 0.03) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1;
        }

        .app {
            position: relative;
            z-index: 2;
            min-height: 100vh;
        }

        .header {
            background: var(--color-surface);
            border-bottom: 2px solid var(--color-border);
            padding: var(--spacing-lg) 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            position: relative;
        }

        .header-controls {
            position: absolute;
            right: var(--spacing-lg);
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: var(--spacing-md);
        }

        .pixel-button {
            font-family: var(--font-primary);
            font-size: 12px;
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-surface);
            color: var(--color-text);
            border: 2px solid var(--color-border);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pixel-button:hover {
            background: var(--color-primary);
            color: var(--color-background);
            border-color: var(--color-primary);
            box-shadow: 0 0 20px var(--color-shadow);
            transform: translateY(-2px);
        }

        .pixel-button.active {
            background: var(--color-primary);
            color: var(--color-background);
            border-color: var(--color-primary);
        }

        .category-nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
            justify-content: center;
        }

        .project-grid-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-lg);
            min-height: calc(100vh - 200px);
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
            align-items: start;
        }

        .project-card {
            aspect-ratio: 4/3;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            background: var(--color-surface);
            border: 2px solid var(--color-border);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .project-card:hover {
            border-color: var(--color-primary);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5), 0 0 20px var(--color-shadow);
            transform: translateY(-4px) scale(1.05);
        }

        .card-thumbnail {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .thumbnail-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.5s ease;
            image-rendering: pixelated;
        }

        .project-card:hover .thumbnail-image {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 0%, transparent 50%, rgba(0, 0, 0, 0.8) 100%);
            display: flex;
            align-items: flex-end;
            padding: var(--spacing-md);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover .card-overlay {
            opacity: 1;
        }

        .card-title {
            font-family: var(--font-primary);
            font-size: 12px;
            color: var(--color-primary);
            margin-bottom: var(--spacing-xs);
            text-shadow: 1px 1px 0 var(--color-background);
            line-height: 1.2;
        }

        .card-category {
            font-family: var(--font-secondary);
            font-size: 10px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--color-surface);
            padding: var(--spacing-xs) var(--spacing-sm);
            border: 1px solid var(--color-border);
            display: inline-block;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
            animation: scanline 3s linear infinite;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes scanline {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        /* 动态标题样式 */
        .animated-title {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .title-text {
            font-family: var(--font-primary);
            font-size: 24px;
            color: var(--color-primary);
            text-shadow: 2px 2px 0 var(--color-background);
            letter-spacing: 2px;
            margin: 0;
            text-align: center;
        }

        .cursor {
            animation: blink 1s infinite;
            color: var(--color-accent);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .title-dots {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .char-dots {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .dot-row {
            display: flex;
            gap: 2px;
        }

        .dot {
            width: 8px;
            height: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6px;
            color: var(--color-text-secondary);
            opacity: 0;
            animation: dotAppear 0.3s ease-out forwards;
        }

        .dot.active {
            color: var(--color-primary);
            text-shadow: 0 0 4px var(--color-shadow);
        }

        @keyframes dotAppear {
            from {
                opacity: 0;
                transform: scale(0);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 模态框样式 */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            animation: fadeIn 0.3s ease-out;
        }

        .modal-backdrop.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            max-width: 800px;
            max-height: 90vh;
            width: 100%;
            background: var(--color-surface);
            border: 2px solid var(--color-border);
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            animation: modalSlideIn 0.4s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: var(--spacing-md);
            right: var(--spacing-md);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-header {
            padding: var(--spacing-xl) var(--spacing-lg) var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
            text-align: center;
        }

        .modal-title {
            font-family: var(--font-primary);
            font-size: 20px;
            color: var(--color-primary);
            margin-bottom: var(--spacing-sm);
            text-shadow: 1px 1px 0 var(--color-background);
            line-height: 1.3;
        }

        .modal-category {
            font-family: var(--font-secondary);
            font-size: 12px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--color-background);
            padding: var(--spacing-xs) var(--spacing-sm);
            border: 1px solid var(--color-border);
            display: inline-block;
        }

        .modal-body {
            padding: var(--spacing-lg);
            flex: 1;
        }

        .modal-description {
            margin-bottom: var(--spacing-lg);
        }

        .modal-description p {
            font-family: var(--font-secondary);
            font-size: 14px;
            line-height: 1.6;
            color: var(--color-text);
        }

        .modal-video {
            margin-bottom: var(--spacing-lg);
            border: 2px solid var(--color-border);
            overflow: hidden;
        }

        .modal-video iframe {
            display: block;
            width: 100%;
            height: 315px;
        }

        .modal-screenshots {
            margin-top: var(--spacing-lg);
        }

        .modal-screenshots h3 {
            font-family: var(--font-primary);
            font-size: 14px;
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
            text-shadow: 1px 1px 0 var(--color-background);
        }

        /* 图片轮播样式 */
        .image-carousel {
            width: 100%;
            position: relative;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            border: 2px solid var(--color-border);
            background: var(--color-surface);
        }

        .carousel-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        .carousel-nav:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-prev {
            left: var(--spacing-md);
        }

        .carousel-next {
            right: var(--spacing-md);
        }

        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--color-border);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .indicator:hover {
            background: var(--color-primary);
            border-color: var(--color-primary);
            transform: scale(1.2);
        }

        .indicator.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            box-shadow: 0 0 10px var(--color-shadow);
        }

        .carousel-counter {
            text-align: center;
            margin-top: var(--spacing-sm);
            font-family: var(--font-secondary);
            font-size: 12px;
            color: var(--color-text-secondary);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: var(--spacing-md);
                text-align: center;
            }
            
            .header-controls {
                position: static;
                transform: none;
                margin-top: var(--spacing-md);
            }
            
            .title-text {
                font-size: 18px;
            }
            
            .project-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: var(--spacing-md);
            }
            
            .dot {
                width: 6px;
                height: 6px;
                font-size: 4px;
            }
        }

        @media (max-width: 480px) {
            .project-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }
            
            .title-text {
                font-size: 16px;
            }
            
            .dot {
                width: 4px;
                height: 4px;
                font-size: 3px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="scanline"></div>
        
        <header class="header">
            <div class="header-content">
                <div class="animated-title" id="animatedTitle">
                    <h1 class="title-text">
                        <span id="displayedText"></span>
                        <span class="cursor">|</span>
                    </h1>
                </div>
                
                <div class="header-controls">
                    <button class="pixel-button" onclick="toggleLanguage()">语言: EN</button>
                </div>
            </div>
            
            <nav class="category-nav">
                <button class="pixel-button active" onclick="filterProjects('all')">全部</button>
                <button class="pixel-button" onclick="filterProjects('game')">游戏</button>
                <button class="pixel-button" onclick="filterProjects('music')">音乐</button>
                <button class="pixel-button" onclick="filterProjects('art')">绘画</button>
                <button class="pixel-button" onclick="filterProjects('penspinning')">转笔</button>
            </nav>
        </header>

        <main class="project-grid-container">
            <div class="project-grid" id="projectGrid">
                <!-- 项目卡片将通过JavaScript动态生成 -->
            </div>
        </main>

        <!-- 模态框 -->
        <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <button class="modal-close pixel-button" onclick="closeModal()">×</button>
                <div class="modal-header">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <span class="modal-category" id="modalCategory"></span>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- 模态框内容将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 项目数据
        const projects = [
            {
                id: "project-001",
                title: "像素冒险游戏",
                category: "game",
                thumbnail: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&h=300&fit=crop",
                description: "一个复古像素风格的2D平台冒险游戏，玩家需要控制角色穿越各种障碍和敌人，收集道具并拯救公主。游戏采用经典的8位音效和像素艺术风格，致敬经典游戏时代。",
                vimeoEmbed: "https://player.vimeo.com/video/148751763?h=1f9f9f9f9f",
                screenshots: [
                    "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800&h=600&fit=crop",
                    "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800&h=600&fit=crop",
                    "https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=800&h=600&fit=crop"
                ]
            },
            {
                id: "project-002",
                title: "电子音乐作品集",
                category: "music",
                thumbnail: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&h=300&fit=crop",
                description: "一系列实验性电子音乐作品，融合了合成器、采样和数字音效。每首曲子都有独特的氛围和情感表达，探索了电子音乐的各种可能性。",
                vimeoEmbed: "https://player.vimeo.com/video/148751763?h=2f9f9f9f9f",
                screenshots: [
                    "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=800&h=600&fit=crop",
                    "https://images.unsplash.com/photo-1571330735066-03aaa9429d89?w=800&h=600&fit=crop"
                ]
            },
            {
                id: "project-003",
                title: "数字绘画作品",
                category: "art",
                thumbnail: "https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=400&h=300&fit=crop",
                description: "使用数字绘画技术创作的系列作品，探索了色彩、光影和构图的无限可能。每幅作品都讲述了一个独特的故事，展现了数字艺术的魅力。",
                screenshots: [
                    "https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=800&h=600&fit=crop",
                    "https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?w=800&h=600&fit=crop",
                    "https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=800&h=600&fit=crop",
                    "https://images.unsplash.com/photo-1549490349-8643362247b5?w=800&h=600&fit=crop"
                ]
            },
            {
                id: "project-004",
                title: "转笔技巧展示",
                category: "penspinning",
                thumbnail: "https://images.unsplash.com/photo-1581833971358-2c8b550f87b3?w=400&h=300&fit=crop",
                description: "展示各种转笔技巧和组合动作的视频合集。从基础动作到高级技巧，展现了转笔这项手部极限运动的艺术性和技巧性。",
                vimeoEmbed: "https://player.vimeo.com/video/148751763?h=3f9f9f9f9f",
                screenshots: [
                    "https://images.unsplash.com/photo-1581833971358-2c8b550f87b3?w=800&h=600&fit=crop",
                    "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&h=600&fit=crop"
                ]
            },
            {
                id: "project-005",
                title: "太空探索游戏",
                category: "game",
                thumbnail: "https://images.unsplash.com/photo-1446776877081-d282a0f896e2?w=400&h=300&fit=crop",
                description: "一个科幻主题的太空探索游戏，玩家驾驶飞船在宇宙中航行，发现新的星球和文明。游戏具有开放世界元素和丰富的剧情线。",
                screenshots: [
                    "https://images.unsplash.com/photo-1446776877081-d282a0f896e2?w=800&h=600&fit=crop",
                    "https://images.unsplash.com/photo-1502134249126-9f3755a50d78?w=800&h=600&fit=crop",
                    "https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=800&h=600&fit=crop"
                ]
            },
            {
                id: "project-006",
                title: "概念艺术设计",
                category: "art",
                thumbnail: "https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?w=400&h=300&fit=crop",
                description: "为游戏项目创作的概念艺术和角色设计。每幅作品都展现了独特的视觉风格和创意理念。",
                screenshots: [
                    "https://images.unsplash.com/photo-1513475382585-d06e58bcb0e0?w=800&h=600&fit=crop",
                    "https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=800&h=600&fit=crop"
                ]
            }
        ];

        let currentFilter = 'all';
        let currentLanguage = 'zh-CN';

        // 动态标题动画
        function animateTitle() {
            const targetText = 'Erenyx';
            const displayedText = document.getElementById('displayedText');
            let currentIndex = 0;
            
            function typeNext() {
                if (currentIndex < targetText.length) {
                    displayedText.textContent += targetText[currentIndex];
                    currentIndex++;
                    setTimeout(typeNext, 200);
                } else {
                    // 完成后等待2秒，然后重新开始
                    setTimeout(() => {
                        displayedText.textContent = '';
                        currentIndex = 0;
                        setTimeout(typeNext, 500);
                    }, 2000);
                }
            }
            
            typeNext();
        }

        // 生成项目卡片
        function generateProjectCards(projectsToShow) {
            const grid = document.getElementById('projectGrid');
            grid.innerHTML = '';
            
            projectsToShow.forEach((project, index) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.innerHTML = `
                    <div class="card-thumbnail">
                        <img src="${project.thumbnail}" alt="${project.title}" class="thumbnail-image">
                        <div class="card-overlay">
                            <div class="overlay-content">
                                <h3 class="card-title">${project.title}</h3>
                                <span class="card-category">${project.category}</span>
                            </div>
                        </div>
                    </div>
                `;
                card.onclick = () => openModal(project);
                grid.appendChild(card);
            });
        }

        // 筛选项目
        function filterProjects(category) {
            currentFilter = category;
            
            // 更新按钮状态
            document.querySelectorAll('.category-nav .pixel-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 筛选项目
            const filteredProjects = category === 'all' 
                ? projects 
                : projects.filter(project => project.category === category);
            
            generateProjectCards(filteredProjects);
        }

        // 打开模态框
        function openModal(project) {
            const modal = document.getElementById('modalBackdrop');
            const title = document.getElementById('modalTitle');
            const category = document.getElementById('modalCategory');
            const body = document.getElementById('modalBody');
            
            title.textContent = project.title;
            category.textContent = project.category;
            
            let bodyContent = '';
            
            if (project.description) {
                bodyContent += `
                    <div class="modal-description">
                        <p>${project.description}</p>
                    </div>
                `;
            }
            
            if (project.vimeoEmbed) {
                bodyContent += `
                    <div class="modal-video">
                        <iframe src="${project.vimeoEmbed}" width="100%" height="315" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${project.title}"></iframe>
                    </div>
                `;
            }
            
            if (project.screenshots && project.screenshots.length > 0) {
                bodyContent += `
                    <div class="modal-screenshots">
                        <h3>截图展示</h3>
                        <div class="image-carousel">
                            <div class="carousel-container">
                                <img src="${project.screenshots[0]}" alt="Screenshot 1" class="carousel-image" id="carouselImage">
                                ${project.screenshots.length > 1 ? `
                                    <button class="carousel-nav carousel-prev pixel-button" onclick="previousImage()">←</button>
                                    <button class="carousel-nav carousel-next pixel-button" onclick="nextImage()">→</button>
                                ` : ''}
                            </div>
                            ${project.screenshots.length > 1 ? `
                                <div class="carousel-indicators" id="carouselIndicators">
                                    ${project.screenshots.map((_, index) => `
                                        <button class="indicator ${index === 0 ? 'active' : ''}" onclick="goToImage(${index})"></button>
                                    `).join('')}
                                </div>
                                <div class="carousel-counter">
                                    <span id="carouselCounter">1 / ${project.screenshots.length}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }
            
            body.innerHTML = bodyContent;
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
            
            // 设置轮播数据
            if (project.screenshots && project.screenshots.length > 1) {
                window.currentScreenshots = project.screenshots;
                window.currentImageIndex = 0;
            }
        }

        // 关闭模态框
        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            
            const modal = document.getElementById('modalBackdrop');
            modal.classList.remove('show');
            document.body.style.overflow = 'unset';
        }

        // 图片轮播功能
        function nextImage() {
            if (!window.currentScreenshots) return;
            window.currentImageIndex = (window.currentImageIndex + 1) % window.currentScreenshots.length;
            updateCarousel();
        }

        function previousImage() {
            if (!window.currentScreenshots) return;
            window.currentImageIndex = (window.currentImageIndex - 1 + window.currentScreenshots.length) % window.currentScreenshots.length;
            updateCarousel();
        }

        function goToImage(index) {
            if (!window.currentScreenshots) return;
            window.currentImageIndex = index;
            updateCarousel();
        }

        function updateCarousel() {
            const image = document.getElementById('carouselImage');
            const counter = document.getElementById('carouselCounter');
            const indicators = document.querySelectorAll('.indicator');
            
            if (image && window.currentScreenshots) {
                image.src = window.currentScreenshots[window.currentImageIndex];
            }
            
            if (counter && window.currentScreenshots) {
                counter.textContent = `${window.currentImageIndex + 1} / ${window.currentScreenshots.length}`;
            }
            
            indicators.forEach((indicator, index) => {
                indicator.classList.toggle('active', index === window.currentImageIndex);
            });
        }

        // 语言切换
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'zh-CN' ? 'en-US' : 'zh-CN';
            const button = event.target;
            button.textContent = `语言: ${currentLanguage === 'zh-CN' ? 'EN' : '中'}`;
            
            // 这里可以添加更多语言切换逻辑
            console.log('切换到语言:', currentLanguage);
        }

        // 键盘事件
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            animateTitle();
            generateProjectCards(projects);
        });
    </script>
</body>
</html>
